name: CI — Build & Test

on:
  push:
    branches: [main, sui-pivot]
  pull_request:
    branches: [main]

jobs:
  sui-build:
    name: Build Move contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI
        run: |
          curl -fsSL https://github.com/MystenLabs/sui/releases/latest/download/sui-testnet-v1.70.2-ubuntu-x86_64.tgz -o sui.tgz || \
          curl -fsSL https://github.com/MystenLabs/sui/releases/download/mainnet-v1.70.2/sui-mainnet-v1.70.2-ubuntu-x86_64.tgz -o sui.tgz
          tar xzf sui.tgz
          chmod +x sui
          sudo mv sui /usr/local/bin/
          sui --version || echo "Sui install may need different binary name"

      - name: Build Move package
        run: cd move && sui move build

      - name: Run Move tests
        run: cd move && sui move test

  node-check:
    name: MCP server check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP server deps
        run: cd mcp-server && npm ci --no-audit --no-fund

      - name: Stage deployments for the smoke test
        run: cd mcp-server && node copy-deployments.mjs

      - name: Run MCP server tests (logic + startup smoke)
        run: cd mcp-server && npm test

  state-check:
    name: docs/state.md is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify docs/state.md matches move/deployments*.json
        run: node scripts/generate-state.mjs --check

      # generate-state only compares docs/state.md to move/deployments.json. It
      # passed for months while the published deployments.json, the dapp
      # constants and 20 doc files all named superseded IDs — including a
      # ModerationBoard from the abandoned v4 package, which made every
      # moderation call fail. This compares the shipped surfaces too.
      - name: Verify deployed surfaces name current on-chain IDs
        run: node scripts/check-id-drift.mjs
